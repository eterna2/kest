version: 2
updates:
  # GitHub Actions — pin and keep action SHAs up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Rust / Cargo (kest-core native Rust extension)
  - package-ecosystem: "cargo"
    directory: "/libs/kest-core/python"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # Python (pip/uv ecosystem)
  - package-ecosystem: "pip"
    directory: "/libs/kest-core/python"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  # Node / Bun (website)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      npm-dependencies:
        patterns:
          - "*"
