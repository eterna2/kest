name: PR Preview — Site

# Publishes a preview of the website docs to a GitHub Pages subfolder
# for every open pull request.  The preview lives at:
#
#   https://<org>.github.io/kest/preview/<branch-slug>/
#
# On PR close/merge the subfolder is automatically removed.
# The root splash page (index.html) is regenerated after every deploy/cleanup.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "website/**"
      - ".github/workflows/preview-site.yml"
      - ".github/scripts/gen-pages-index.sh"

permissions:
  contents: read

# One preview per PR — cancel stale builds when a new commit is pushed.
concurrency:
  group: "preview-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Shared step: regenerate root index.html on gh-pages.
# Called via a composite pattern (inlined below in each job).
# ---------------------------------------------------------------------------

jobs:
  # ------------------------------------------------------------------
  # BUILD & DEPLOY  (runs on opened / synchronize / reopened)
  # ------------------------------------------------------------------
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # push to gh-pages branch
      pull-requests: write # post preview URL comment

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Derive a URL-safe folder name from the branch name.
      # e.g. "feat/my-feature" → "feat-my-feature"
      - name: Compute branch slug
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH="$HEAD_REF"
          SLUG=$(echo "$BRANCH" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Preview folder: preview/$SLUG"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest

      - name: Install website dependencies
        working-directory: website
        run: bun install

      - name: Build website (preview)
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /kest/preview/${{ steps.slug.outputs.slug }}
        run: bun run build

      - name: Deploy to gh-pages (subfolder)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/out
          destination_dir: preview/${{ steps.slug.outputs.slug }}
          keep_files: true
          commit_message: "preview: update ${{ steps.slug.outputs.slug }} (PR #${{ github.event.pull_request.number }})"

      # Regenerate root splash page so new preview appears in the index.
      - name: Checkout gh-pages for index update
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Regenerate root index.html
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          cp .github/scripts/gen-pages-index.sh gh-pages-branch/gen-pages-index.sh
          chmod +x gh-pages-branch/gen-pages-index.sh
          cd gh-pages-branch
          bash gen-pages-index.sh "$OWNER" "$REPO"
          rm gen-pages-index.sh

      - name: Commit & push updated index.html
        run: |
          cd gh-pages-branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged — nothing to commit."
          else
            git commit -m "preview(index): add preview/${{ steps.slug.outputs.slug }}"
            git push
          fi

      # Post or update a single comment on the PR with the live URL.
      - name: Comment preview URL on PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b  # v3
        with:
          message: |
            ### 🔍 Site Preview Deployed

            | Deployment | URL |
            |---|---|
            | **This PR** | https://${{ github.repository_owner }}.github.io/kest/preview/${{ steps.slug.outputs.slug }}/ |
            | `stable` (current main) | https://${{ github.repository_owner }}.github.io/kest/stable/ |
            | All versions | https://${{ github.repository_owner }}.github.io/kest/ |
            | **Branch** | `${{ github.head_ref }}` |
            | **Commit** | `${{ github.sha }}` |

            > Preview updates automatically on every push to this branch. It will be removed when this PR is closed.
          comment-tag: "site-preview-${{ github.event.pull_request.number }}"

  # ------------------------------------------------------------------
  # CLEANUP  (runs only when the PR is closed / merged)
  # ------------------------------------------------------------------
  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source (for gen-pages-index.sh)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Checkout gh-pages branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Compute branch slug
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH="$HEAD_REF"
          SLUG=$(echo "$BRANCH" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Remove preview subfolder & regenerate index
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          cd gh-pages-branch
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="preview/${{ steps.slug.outputs.slug }}"
          CHANGED=false

          if [ -d "$TARGET" ]; then
            git rm -rf "$TARGET"
            CHANGED=true
          else
            echo "Preview folder '$TARGET' not found — skipping removal."
          fi

          # Regenerate index regardless (ensures it's always up-to-date)
          cp ../.github/scripts/gen-pages-index.sh ./gen-pages-index.sh
          bash gen-pages-index.sh "$OWNER" "$REPO"
          rm gen-pages-index.sh
          git add index.html
          git diff --cached --quiet || CHANGED=true

          if [ "$CHANGED" = "true" ]; then
            git commit -m "preview(index): remove ${{ steps.slug.outputs.slug }} (PR #${{ github.event.pull_request.number }} closed)"
            git push
          else
            echo "Nothing changed — skipping push."
          fi
