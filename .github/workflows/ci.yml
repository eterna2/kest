name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install proto
        uses: moonrepo/setup-proto@v1.1.1

      - name: Install dependencies
        run: proto install

      - name: Run Tests with Coverage
        run: moon run kest-core-python:test

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: libs/kest-core/python/coverage.xml