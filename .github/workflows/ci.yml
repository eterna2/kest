name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # coveralls status check
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install proto
        uses: moonrepo/setup-proto@f03c0e4aa1026f17d6e82d04cf1c30aab0a51a8a  # v1.1.1

      - name: Install dependencies
        run: proto install

      - name: Run Tests with Coverage
        run: moon run kest-core-python:test

      - name: Coveralls
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e  # v2
        with:
          file: libs/kest-core/python/coverage.xml