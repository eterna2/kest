$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'python'
layer: 'library'
stack: 'backend'

tags: ['python', 'kest-core']

tasks:
  check:
    script: 'uv sync'
    deps:
      - 'install'
    inputs:
      - 'pyproject.toml'
  test:
    script: 'uv run pytest'
    deps:
      - 'check'
    inputs:
      - 'src/**/*.py'
      - 'tests/**/*.py'
  up:
    script: "moon run kest-lab:up"
  test-live:
    script: "moon run kest-lab:test-live"
    deps:
      - "check"
    inputs:
      - 'src/**/*.py'
  typecheck:
    script: 'uv run mypy --ignore-missing-imports src/'
    deps:
      - 'install'
    inputs:
      - 'src/**/*.py'
  run-e2e:
    script: 'uv run python examples/e2e/main.py'
    deps:
      - 'check'
    inputs:
      - 'examples/**/*.py'
      - 'src/**/*.py'
  viz:
    script: 'uv run kest-viz $path'
    deps:
      - 'check'
    args:
      - 'path'
  bench:
    script: 'bash examples/bench/run_all.sh'
    deps:
      - 'check'
    inputs:
      - 'examples/bench/**/*.py'
      - 'examples/bench/**/*.sh'
      - 'src/**/*.py'
  # --- FsspecAgent terminal demo ---
  rustfs-up:
    description: "Start the RustFS S3-compatible store in kest-lab and init the kest-demo bucket."
    script: "moon run kest-lab:rustfs-up"
  rustfs-down:
    description: "Stop the RustFS containers in kest-lab."
    script: "moon run kest-lab:rustfs-down"
  run-terminal:
    description: "Launch the Kest FsspecAgent TUI demo (local FS sandbox by default)."
    script: 'uv run --extra tui kest-terminal'
    deps:
      - 'check'
    inputs:
      - 'src/**/*.py'
      - 'examples/**/*.py'
  run-terminal-s3:
    description: "Launch the demo with s3fs installed so you can 'mount s3' to RustFS."
    script: 'uv run --extra tui --extra s3 kest-terminal'
    deps:
      - 'check'
      - 'rustfs-up'
    inputs:
      - 'src/**/*.py'
      - 'examples/**/*.py'
