[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kest-deepagents"
version = "0.1.0"
description = "Kest multi-agent security adapter for DeepAgents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "eterna2", email = "ceilingcat@kest.sh" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "deepagents",
    "fsspec>=2024.2.0",
    "kest>=0.3.0",
    "langchain-core>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kest"]

[project.urls]
Homepage = "https://github.com/eterna2/kest/"
Documentation = "https://eterna2.github.io/kest/stable"
Repository = "https://github.com/eterna2/kest/"

[project.optional-dependencies]
tui = [
    "textual>=0.59",
]
s3 = [
    "s3fs>=2024.2.0",
]
gcs = [
    "gcsfs>=2024.2.0",
]
all = [
    "textual>=0.59",
    "s3fs>=2024.2.0",
    "gcsfs>=2024.2.0",
]

[project.scripts]
kest-agent = "kest.deepagents.cli:agent"

[tool.uv.sources]
kest = { path = "../../kest-core/python", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "kest",
    "fsspec>=2024.2.0",
    "ruff>=0.15.11",
    "mypy>=1.20.1",
]
