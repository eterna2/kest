[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kest"
version = "0.3.0"
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "httpx>=0.27.0"
]

[project.scripts]
kest-viz = "kest.cli.viz:main"

[project.optional-dependencies]
spiffe = [
    "spiffe>=0.2.6",
]
aws = [
    "boto3>=1.28.0",
    "aioboto3>=11.0.0",
]
opa = [
    "opa-python-client>=1.0.0",
]
cedar = [
    "cedarpy>=0.1.0",
]
rego = [
    "regopy>=0.3.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "kest.core._core"

[dependency-groups]
dev = [
    "maturin>=1.5,<2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "cryptography>=42.0.0",
    "spiffe>=0.2.6",
    "hypothesis>=6.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "boto3>=1.28.0",
    "moto[kms,sts]>=5.0.0",
    "regopy>=0.3.0",
]

[tool.pytest.ini_options]
markers = [
    "live: integration tests requiring live infrastructure (SPIRE, OPA, etc.)",
]
