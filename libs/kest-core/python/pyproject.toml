[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "kest"
version = "0.4.0"
description = "A Zero-Trust validation and telemetry toolkit for multi-agent workloads."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "eterna2", email = "ceilingcat@kest.sh" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "httpx>=0.28.1",
    "uuid-utils>=0.14.1",
    "rfc8785>=0.1.4",
    "cryptography>=46.0.7",
    "boto3>=1.40.61",
    "e2b-code-interpreter>=2.6.0",
    "bedrock-agentcore>=1.3.2",
    "pydantic-monty>=0.0.17",
]

[project.urls]
Homepage = "https://github.com/eterna2/kest/"
Documentation = "https://eterna2.github.io/kest/stable"
Repository = "https://github.com/eterna2/kest/"

[project.scripts]
kest-viz = "kest.cli.viz:main"

[project.optional-dependencies]
spiffe = ["spiffe>=0.2.6"]
aws = ["boto3>=1.28.0", "aioboto3>=15.5.0"]
opa = ["opa-python-client>=2.0.4"]
cedar = ["cedarpy>=4.8.0"]
rego = ["regopy>=0.3.0"]
schema = ["jsonschema>=4.0.0"]
# Vault cache backends (all optional)
lmdb = ["lmdb>=1.4.0"]
cachetools = ["cachetools>=5.0.0"]
redis = ["redis>=5.0.0"]
valkey = ["valkey>=6.0.0"]
# Vault codec compression (all optional)
lz4 = ["lz4>=4.0.0"]
zstd = ["zstandard>=0.22.0"]
# FastAPI integration plugin (all optional)
fastapi = ["fastapi>=0.115.0", "python-jose[cryptography]>=3.3.0"]
# Sandbox backends (all optional)
e2b = ["e2b-code-interpreter>=1.0.0"]
agentcore = ["boto3>=1.28.0", "aioboto3>=15.5.0"]
monty = ["pydantic-monty>=0.0.17"]


[tool.hatch.build.targets.wheel]
packages = ["src/kest"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "respx>=0.23.1",
    "cryptography>=46.0.7",
    "spiffe>=0.2.6",
    "hypothesis>=6.151.12",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "boto3>=1.28.0",
    "moto[kms,sts]>=5.0.0",
    "regopy>=0.3.0",
    "cedarpy>=4.8.0",
    "pyperf>=2.10.0",
    "jsonschema>=4.0.0",
    # Vault backend testing
    "cachetools>=5.0.0",
    "fakeredis>=2.0.0",
    # FastAPI integration testing
    "fastapi>=0.115.0",
    "python-jose[cryptography]>=3.3.0",
    "anyio>=4.0.0",
    # Sandbox integration testing (live)
    "e2b-code-interpreter>=1.0.0",
    "pydantic-monty>=0.0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: integration tests requiring live infrastructure (SPIRE, OPA, etc.)",
    "sandbox_live: sandbox integration tests requiring API keys (E2B, AWS).",
]
