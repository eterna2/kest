[build-system]
requires = ["maturin>=1.5,<1.13"]
build-backend = "maturin"

[project]
name = "kest"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.31.0",
    "opentelemetry-exporter-otlp>=1.31.0",
    "httpx>=0.28.1",
    "uuid-utils>=0.9.0"
]

[project.scripts]
kest-viz = "kest.cli.viz:main"

[project.optional-dependencies]
spiffe = [
    "spiffe>=0.2.6",
]
aws = [
    "boto3>=1.28.0",
    "aioboto3>=11.0.0",
]
opa = [
    "opa-python-client>=1.0.0",
]
cedar = [
    "cedarpy>=0.1.0",
]
rego = [
    "regopy>=0.3.0",
]
python-backend = [
    "rfc8785>=0.1.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "kest.core._core"

[dependency-groups]
dev = [
    "maturin>=1.5,<1.13",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "respx>=0.23.1",
    "cryptography>=42.0.0",
    "spiffe>=0.2.6",
    "hypothesis>=6.151.12",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "boto3>=1.28.0",
    "moto[kms,sts]>=5.0.0",
    "regopy>=0.3.0",
    "pyperf>=2.6.0",
]

[tool.pytest.ini_options]
markers = [
    "live: integration tests requiring live infrastructure (SPIRE, OPA, etc.)",
]
