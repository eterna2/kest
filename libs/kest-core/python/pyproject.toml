[build-system]
requires = ["maturin>=1.13.1,<1.14"]
build-backend = "maturin"

[project]
name = "kest"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "httpx>=0.28.1",
    "uuid-utils>=0.14.1",
    "moto>=5.1.22",
    "regopy>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
kest-viz = "kest.cli.viz:main"

[project.optional-dependencies]
spiffe = [
    "spiffe>=0.2.6",
]
aws = [
    "boto3>=1.42.88",
    "aioboto3>=15.5.0",
]
opa = [
    "opa-python-client>=2.0.4",
]
cedar = [
    "cedarpy>=4.8.0",
]
rego = [
    "regopy>=0.3.0",
]
python-backend = [
    "rfc8785>=0.1.4",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "kest.core._core"

[dependency-groups]
dev = [
    "maturin>=1.13.1,<1.14",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "respx>=0.23.1",
    "cryptography>=46.0.7",
    "spiffe>=0.2.6",
    "hypothesis>=6.151.12",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "boto3>=1.42.88",
    "moto[kms,sts]>=5.0.0",
    "regopy>=0.3.0",
    "pyperf>=2.10.0",
]

[tool.pytest.ini_options]
markers = [
    "live: integration tests requiring live infrastructure (SPIRE, OPA, etc.)",
]
