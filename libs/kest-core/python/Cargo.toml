[package]
name = "kest-core-py"
version = "0.3.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["abi3-py311"] }
kest-core-rs = { path = "../rust" }
kest-runtime-rs = { path = "../rust-v2" }
serde_json = "1.0"
base64 = "0.22"
serde_json_canonicalizer = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.10"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
