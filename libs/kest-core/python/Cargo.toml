[package]
name = "kest-core-py"
version = "0.3.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py311"] }
kest-core-rs = { path = "../rust" }
serde_json = "1.0"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]
