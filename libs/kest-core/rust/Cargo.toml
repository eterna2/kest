[package]
name = "kest-core-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
uuid = { version = "1.10", features = ["v7", "serde", "js"] }
base64 = "0.22"
sha2 = "0.10"
wasm-bindgen = { version = "0.2", optional = true }
serde_json_canonicalizer = "0.2"
thiserror = "2.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
