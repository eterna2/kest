\",\"category\":\"API Spec\"},{\"title\":\"Models\",\"description\":\"Core data structures for execution lineage and trust.\",\"slug\":\"models\",\"href\":\"/developers/api/models\",\"category\":\"API Spec\"},{\"title\":\"Identity Providers\",\"description\":\"Platform-specific workload identification and cryptographic signing.\",\"slug\":\"identity\",\"href\":\"/developers/api/identity\",\"category\":\"API Spec\"},{\"title\":\"Context Helpers\",\"description\":\"Read the current Kest execution context from anywhere in your call stack.\",\"slug\":\"context\",\"href\":\"/developers/api/context\",\"category\":\"API Spec\"},{\"title\":\"Core Engine\",\"description\":\"Unified interface for policy evaluation across different engines.\",\"slug\":\"engine\",\"href\":\"/developers/api/engine\",\"category\":\"API Spec\"},{\"title\":\"Decorators\",\"description\":\"High-level Python decorators for securing application execution.\",\"slug\":\"decorators\",\"href\":\"/developers/api/decorators\",\"category\":\"API Spec\"},{\"title\":\"Policy Library\",\"description\":\"**Kest** provides a library of battle-tested security policies that implement foundational security models. These are designed to be used as primitive building \",\"slug\":\"README\",\"href\":\"/developers/policy/README\",\"category\":\"Policy\"},{\"title\":\"Policy Library\",\"description\":\"Kest provides a comprehensive library of pre-built security policies for both Open Policy Agent (Rego) and Cedar. These policies implement standard security mod\",\"slug\":\"overview\",\"href\":\"/developers/policy/overview\",\"category\":\"Policy\"},{\"title\":\"Continuous Adaptive Risk and Trust Assessment (CARTA)\",\"description\":\"Kest implements the CARTA model by propagating and attenuating trust scores throughout the execution graph.\",\"slug\":\"trust\",\"href\":\"/developers/policy/trust\",\"category\":\"Policy\"},{\"title\":\"Pre-built Rego Policies (OPA)\",\"description\":\"Standard security models implemented
