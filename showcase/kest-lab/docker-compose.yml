services:
  # --- SPIRE: Workload Identity ---
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.0
    volumes:
      - ./spire/server:/run/spire/config
      - spire-server-data:/opt/spire
    command: ["-config", "/run/spire/config/server.conf"]
    ports:
      - "8081:8081"

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.0
    volumes:
      - ./spire/agent:/run/spire/config
      - spire-agent-data:/opt/spire
      - ./spire/agent/public:/var/run/spire/agent/public
    command: ["-config", "/run/spire/config/agent.conf", "-joinToken", "${JOIN_TOKEN:-unset}"]
    user: 0:0
    pid: host
    privileged: true
    environment:
      - JOIN_TOKEN=${JOIN_TOKEN:-}
    depends_on:
      - spire-server

  # --- Keycloak: Human Identity Provider ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm", "--features=token-exchange"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_PORT=8080
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/kest-lab || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # --- OPA: Policy as Code (Rego) ---
  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--log-level=info", "--addr", ":8181", "--watch", "/policies"]
    volumes:
      - ./opa/policies:/policies
    ports:
      - "8181:8181"

  # --- Cedar Agent: Policy Enforcement ---
  cedar-agent:
    image: permitio/cedar-agent:latest
    command: ["--addr", "0.0.0.0:8180"]
    volumes:
      - ./cedar/policies:/policies
    ports:
      - "8180:8180"

  # --- OTel Collector: Audit Log Aggregation ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  # --- Distributed Workloads ---
  hop1: &workload-template
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../../libs:/libs
      - .:/workspace/app
      - ./spire/agent/public:/var/run/spire/agent/public:ro
      # Named volume shadows /workspace/app/.venv so uv sync writes here (container-managed)
      # instead of bleeding root ownership back to the host bind-mount.
      - kest-lab-venv:/workspace/app/.venv
    working_dir: /workspace/app
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent/public/api.sock
      - SERVICE_NAME=hop1
      - NEXT_HOP_URL=http://hop2:8000
      - PYTHONPATH=/libs/kest-core/python/python
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/kest-lab/protocol/openid-connect/certs
      - KEST_LAB_FALLBACK=true
    command: ["sh", "-c", "pip install uv --quiet && uv sync --group test && /workspace/app/.venv/bin/python app.py"]
    ports:
      - "8000:8000"
    depends_on:
      - spire-agent
      - opa
      - cedar-agent
      - otel-collector
      - keycloak

  hop2:
    <<: *workload-template
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent/public/api.sock
      - SERVICE_NAME=hop2
      - NEXT_HOP_URL=http://hop3:8000
      - PYTHONPATH=/libs/kest-core/python/python
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/kest-lab/protocol/openid-connect/certs
      - KEST_LAB_FALLBACK=true
    ports: []

  hop3:
    <<: *workload-template
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent/public/api.sock
      - SERVICE_NAME=hop3
      - NEXT_HOP_URL=none
      - PYTHONPATH=/libs/kest-core/python/python
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/kest-lab/protocol/openid-connect/certs
      - KEST_LAB_FALLBACK=true
    ports: []

  # --- Mocked Agent: OBO Delegation Showcase ---
  kest-agent:
    <<: *workload-template
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent/public/api.sock
      - SERVICE_NAME=kest-agent
      - HOP1_URL=http://hop1:8000
      - PYTHONPATH=/libs/kest-core/python/python
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=kest-lab
      - KEYCLOAK_CLIENT_ID=kest-agent
      - KEYCLOAK_CLIENT_SECRET=kest-agent-secret
      - GATEWAY_URL=http://kest-gateway:8002
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/kest-lab/protocol/openid-connect/certs
      - KEST_LAB_FALLBACK=true
    command: ["sh", "-c", "pip install uv --quiet && uv sync --group test && /workspace/app/.venv/bin/python agent.py"]
    ports:
      - "8001:8001"
    depends_on:
      - hop1
      - keycloak

  # --- Scope-Delegated Gateway: OBO scope enforcement + task token minting ---
  kest-gateway:
    <<: *workload-template
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent/public/api.sock
      - SERVICE_NAME=kest-gateway
      - HOP1_URL=http://hop1:8000
      - PYTHONPATH=/libs/kest-core/python/python
      - KEYCLOAK_JWKS_URI=http://keycloak:8080/realms/kest-lab/protocol/openid-connect/certs
      - TASK_TOKEN_TTL=300
      - KEST_LAB_FALLBACK=true
    command: ["sh", "-c", "pip install uv --quiet && uv sync --group test && /workspace/app/.venv/bin/python gateway.py"]
    ports:
      - "8002:8002"
    depends_on:
      - hop1
      - keycloak
      - otel-collector

  # --- RustFS: S3-compatible Object Storage (written in Rust) ---
  # Connect the FsspecAgent TUI demo to this endpoint:
  #   mount s3  →  endpoint=http://localhost:9000  key=minioadmin  secret=minioadmin
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ROOT_USER: minioadmin
      RUSTFS_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  (http://localhost:9001)
    volumes:
      - rustfs-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # RustFS has no unauthenticated health endpoint — it returns 403 on every
      # request. We treat any response (including 4xx) as "alive"; only a
      # connection-refused (curl exit 7) or timeout counts as unhealthy.
      test: ["CMD-SHELL", "curl -s --max-time 3 -o /dev/null http://localhost:9000/ && exit 0 || [ $? -ne 7 ]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # --- RustFS bucket initialisation ---
  # Creates the kest-demo bucket used by the FsspecAgent TUI demo.
  # Runs once and exits; idempotent (--ignore-existing).
  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set rustfs http://rustfs:9000 minioadmin minioadmin &&
        mc mb --ignore-existing rustfs/kest-demo &&
        mc anonymous set download rustfs/kest-demo &&
        echo 'Bucket kest-demo ready.'
      "
    restart: "no"

volumes:
  spire-server-data:
  spire-agent-data:
  # Isolated venv volume: prevents uv sync (running as root inside container)
  # from chowning the host-side .venv directory to root via bind-mount bleed.
  kest-lab-venv:
  # RustFS object storage data
  rustfs-data:
