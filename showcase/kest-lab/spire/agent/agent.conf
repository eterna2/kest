agent {
    data_dir = "/opt/spire/data"
    log_level = "DEBUG"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/var/run/spire/agent/public/api.sock"
    trust_bundle_path = "/run/spire/config/trust-bundle.pem"
    trust_domain = "kest.internal"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            directory = "/opt/spire"
        }
    }

    WorkloadAttestor "unix" {
        plugin_data {
            # IMPORTANT: We disable path discovery to allow host processes (like pytest)
            # to connect to the containerized SPIRE agent. If enabled, the agent
            # would fail to resolve the host binary paths within the container's /proc.
            # This allows attestation based solely on UID/GID.
            discover_workload_path = false
        }
    }
}
