$schema: "https://moonrepo.dev/schemas/tasks.json"

inheritedBy:
  languages: ["python"]

tasks:
  install:
    command: "uv sync --all-extras"
    inputs:
      - "pyproject.toml"
      - "uv.lock"

  test:
    command: "uv run pytest"
    deps:
      - "install"
    inputs:
      - "src/**/*"
      - "tests/**/*"

  lint:
    command: "uv run ruff check ."
    deps:
      - "install"

  format:
    command: "uv run ruff format ."
    deps:
      - "install"
